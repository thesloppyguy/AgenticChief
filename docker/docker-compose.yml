# Local / Dokploy Compose deploy for AgenticChief (api + web).
#
# Production host (web + API): https://chro.lokibots.ai
#
# SQLite is single-writer: run exactly ONE api container; keep /data on a volume.
#
# Dokploy Compose: uncomment networks + labels below, and ensure dokploy-network exists.
# For two apps on one host, route PathPrefix(`/api`) to the API (no strip — the app serves /api/*),
# and set NEXT_PUBLIC_API_URL=https://chro.lokibots.ai/api.

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "sqlite:////data/chro.db"
      VECTOR_STORE_PATH: "/data/chroma"
      SEED_ROOT: "/app/seed"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://chro.lokibots.ai}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string-of-at-least-32-characters}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SEED_ON_START: ${SEED_ON_START:-auto}
      STUB_DATA_ENABLED: ${STUB_DATA_ENABLED:-true}
    volumes:
      - chrodata:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Dokploy Traefik (same host as web — PathPrefix `/api`, do not strip):
    # networks: [dokploy-network]
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.chro-api.rule=Host(`chro.lokibots.ai`) && PathPrefix(`/api`)
    #   - traefik.http.routers.chro-api.entrypoints=websecure
    #   - traefik.http.routers.chro-api.tls.certResolver=letsencrypt
    #   - traefik.http.services.chro-api.loadbalancer.server.port=8000

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://chro.lokibots.ai/api}
    ports:
      - "3000:3000"
    depends_on: [api]
    restart: unless-stopped
    # Dokploy Traefik:
    # networks: [dokploy-network]
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.chro-web.rule=Host(`chro.lokibots.ai`)
    #   - traefik.http.routers.chro-web.entrypoints=websecure
    #   - traefik.http.routers.chro-web.tls.certResolver=letsencrypt
    #   - traefik.http.services.chro-web.loadbalancer.server.port=3000

volumes:
  chrodata:

