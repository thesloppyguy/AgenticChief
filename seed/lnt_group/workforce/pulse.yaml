as_of: "2026-10-07T07:12:00+05:30"
narrative: >
  Group needs ~2,300 specialised engineers over 24 months for green H₂, electrolyser and
  semiconductor programmes; external market can sustainably supply ~1,000. LTTS holds the
  thinnest Green H₂ / ATMP benches (capability_green_h2 and atmp_leadership drafts ready).
  34 of 130 critical roles have weak succession. Hiring volume is high but future-skill fit
  is only ~9%. Retention at Group is near target overall — LTIM Semiconductor Technologies
  (retention 52) is the IC exception; retention_semi corrective is ready for approval.
synthesized_by: Executive Analytics
insights:
  - Retention (73, Red) is the Group weak spot — exception traces to LTIM (IC retention 52); draft retention_semi awaits approval.
  - ~70% of the 1,300 future-skill gap is buildable internally; LTTS owns the Green H₂ pinch point — draft capability_green_h2 is ready.
  - Ready-now succession down 5 pts; LTTS Green Energy / Semiconductors and LTIM AI / ATMP are thinnest.
  - Bottom-quartile managers (LTTS + LTIM) drive most regretted exits — manager_effectiveness_bq draft routes to both IC CHROs.
