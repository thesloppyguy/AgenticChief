# Synthetic Group workforce briefing pulse (HTML mockup-aligned). Not KPI-engine scores.
as_of: "2026-10-07T07:12:00+05:30"
narrative: >
  Group needs ~2,300 specialised engineers over 24 months for green H₂, electrolyser and
  semiconductor programmes; external market can sustainably supply ~1,000. 34 critical roles
  have thin succession. Hiring volume is high (78k applications for 1,540 engineering roles)
  but future-skill fit is only ~9%. Early-career attrition ties to learning & growth, not pay.
  Retention at Group is near target overall, but L&T Semiconductor Technologies (retention 52)
  is the IC exception — career stagnation, manager quality and learning gaps, not compensation.
synthesized_by: Executive Analytics
insights:
  - Overall the Group is close to target — Retention (score 73) is the weak spot holding it back.
  - Of the 1,300 future-skill roles we need, about 70% can be filled by retraining and moving people we already have.
  - Fewer critical roles have a ready backup than last year (down 5 points); green energy and semiconductors are thinnest.
  - The weakest managers drive most of the regrettable exits — better pay alone will not fix that.
