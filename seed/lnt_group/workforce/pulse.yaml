top_issues:
  - rank: 1
    title: Capability gap in green hydrogen & electrolysers
    priority_label: Defines the next 24 months
    summary: >
      Demand for specialised engineers is outpacing supply. External hiring can meet less
      than a third at a sustainable cost — and buying scarce skills at a premium doesn't build depth.
    severity: high
    tags: [New-business ramp, Scarce external supply, Premium cost]
    recommendation: >
      build internally — reskill + mobility closes ~70% of the gap. Action is ready for your approval.
    flagged_by: [Future Skills, Capability & Learning, Workforce Strategy]
  - rank: 2
    title: Thin succession in the new businesses
    priority_label: High
    summary: >
      34 of 130 critical roles have a weak or no ready successor, concentrated in green energy
      and semiconductors — weak career architecture, not compensation, is the root cause.
    severity: high
    tags: [Weak career architecture, Limited internal mobility, New-business depth]
    recommendation: >
      Continuity risk in green energy and semiconductor leadership within 12–18 months.
      Open senior search where needed and start internal development plans.
    flagged_by: [Internal Mobility & Succession]
  - rank: 3
    title: Hiring quality, not volume
    priority_label: Medium
    summary: >
      78,000 applications for 1,540 engineering roles — the constraint is finding the right,
      future-ready skills, not attracting applicants. Only 9% clear the future-skill bar.
    severity: medium
    tags: [Skill-fit 9%, Changing job requirements, Time-to-productivity]
    recommendation: >
      Raise the skill bar and prioritise adjacent internal moves over volume hiring.
    flagged_by: [Talent Acquisition & Quality-of-Hire]
  - rank: 4
    title: Early-career attrition where growth stalls
    priority_label: Medium
    summary: >
      Attrition concentrates among 0–3 year engineers in units with the weakest
      learning-and-growth signals — the third layer of the employee-experience framework.
    severity: medium
    tags: [Learning & growth, Career visibility, Manager quality]
    recommendation: >
      Career pathways and manager coaching on growth conversations — not pay adjustments.
    flagged_by: [Employee Experience & Retention]
  - rank: 5
    title: Manager effectiveness varies widely
    priority_label: Medium
    summary: >
      Goal-setting, feedback frequency and fairness scores vary sharply by manager cohort.
      The bottom quartile of managers accounts for a disproportionate share of disengagement
      and regretted exits — a capability gap higher pay won't close.
    severity: medium
    tags: [Bottom quartile, Feedback gaps, Goal-setting variance]
    recommendation: >
      Targeted coaching & feedback enablement for bottom-quartile managers.
    flagged_by: [Manager Effectiveness & Performance, Employee Experience]
