# Draft company-wide CHRO actions awaiting approval (HTML mockup-aligned).
drafts:
  - key: capability_green_h2
    action: launch_capability_program
    title: Green energy talent programme
    severity: high
    sla: Decide this week
    summary: >
      Reskill 40 engineers, open 12 internal moves, and name 3 successors for green hydrogen
    detail: >
      Build green hydrogen and electrolyser skills in-house: certify 40 engineers over 12 weeks,
      move 12 people into the green energy business, pair them with 8 mentors, and fast-track
      3 leadership successors. Cheaper and deeper than buying scarce talent on the open market.
    insights:
      - Closes about 70% of the green hydrogen skills gap without premium hiring.
      - 46 people in adjacent EPC roles are ready to enter the programme.
      - Avoided hiring cost ≈ ₹41 Cr vs programme cost ≈ ₹9.2 Cr.
    roi:
      programme_cost_cr: 9.2
      avoided_hiring_premium_cr: 41
      gap_closed_pct: 70
      time_to_productivity_mo: 4
      buy_time_to_productivity_mo: 8
    recipients:
      - email: rohan.iyer@example.com
        role_hint: Group HR Operations
      - email: daniel.joseph@example.com
        role_hint: LTTS CHRO
      - email: kavitha.rao@example.com
        role_hint: LTIM CHRO
    channels: [email, teams]
    routes_to: [L&D, BU heads, HRMS]
    steps:
      - Confirm approval
      - Enrol 40 learners
      - Open 12 mobility cases
      - Assign mentors
      - Confirm 3 succession plans
      - Notify the cohort
      - Start 90-day progress check
    monitor:
      name: Capability 90-day · Green H₂
      days: 90
    propose_args:
      program_key: capability_green_h2
      enrol_count: 40
      mobility_count: 12
      successor_count: 3
      mentor_count: 8
      recipient_emails:
        - rohan.iyer@example.com
        - daniel.joseph@example.com
        - kavitha.rao@example.com
      subject: "Approve: Green energy talent programme"
      body: >
        Group CHRO has approved the green hydrogen talent programme. Please enrol the cohort,
        open the mobility cases, and confirm mentoring. Reply with any blockers within 48 hours.
      channel: email
      company_codes: [LTTS, LTIM]

  - key: retention_semi
    action: launch_retention_corrective
    title: Semiconductor retention plan
    severity: high
    sla: Scorecard exception
    summary: >
      Career paths and manager coaching for at-risk engineers in Semiconductor Technologies
    detail: >
      Group Retention is at 73 (off track). The problem sits in LTIM Semiconductor Technologies
      (retention 52) — career stagnation, manager quality, and learning gaps, not pay.
      Activate career pathways for 58 at-risk engineers and start a manager coaching cohort.
    insights:
      - Drivers are career, manager quality, and learning — not compensation.
      - Top-talent retention (66) and trainee retention (56 vs 80 target) are weakest.
      - A career-led plan is ready for your approval.
    drivers: [career stagnation, manager quality, learning]
    recipients:
      - email: kavitha.rao@example.com
        role_hint: LTIM CHRO
      - email: rohan.iyer@example.com
        role_hint: Group HR Operations
    channels: [email, teams]
    routes_to: [IC HR, L&D, HRMS]
    steps:
      - Confirm approval
      - Review exit and engagement drivers
      - Open pathways for 58 engineers
      - Enrol growth tracks
      - Start manager coaching
      - Begin 90-day retention watch
    monitor:
      name: Retention 90-day · Semi / LTIM
      days: 90
      company_code: LTIM
      pillar: retention
    propose_args:
      program_key: retention_semi
      at_risk_count: 58
      company_code: LTIM
      recipient_emails:
        - kavitha.rao@example.com
        - rohan.iyer@example.com
      subject: "Approve: Semiconductor retention plan"
      body: >
        Group CHRO has approved the semiconductor retention plan. Please activate career
        pathways for 58 at-risk engineers and start manager coaching. Confirm within 48 hours.
      channel: email
      company_codes: [LTIM]

  - key: atmp_leadership
    action: send_directive
    title: ATMP leadership — hire and develop
    severity: medium
    sla: Due in 4 days
    sla_style: plain
    summary: >
      Open a senior search and start two internal development plans
    detail: >
      Semiconductor ATMP leadership has no ready internal successor (readiness ~15%).
      Open a senior search and start two development plans for near-ready successors so
      continuity is covered within 12–18 months.
    insights:
      - Semiconductors have only 2 ready-now successors across critical roles.
      - Best path: one external hire plus developing two internals.
    recipients:
      - email: rohan.iyer@example.com
        role_hint: Group HR Operations
      - email: kavitha.rao@example.com
        role_hint: LTIM CHRO
    channels: [email, teams]
    routes_to: [TA, Succession]
    steps:
      - Open senior ATMP search with Talent Acquisition
      - Nominate two near-ready successors for development plans
      - Align Succession and TA on fill timeline
    propose_args:
      subject: "ATMP leadership: open senior search + 2 development plans"
      body: >
        Please open the senior ATMP leadership search and start two internal development
        plans for nominated near-ready successors. Confirm the search brief and plan owners
        within 4 days.
      channel: email
      recipient_emails:
        - rohan.iyer@example.com
        - kavitha.rao@example.com
      company_codes: [LTIM]

  - key: manager_effectiveness_bq
    action: send_directive
    title: Manager coaching for bottom quartile
    severity: medium
    sla: 30-day SLA
    summary: >
      Targeted coaching and feedback support via L&D and HRBPs
    detail: >
      Goal-setting, feedback, and fairness scores vary sharply by manager cohort.
      The bottom quartile drives much of the disengagement and regretted exits —
      launch coaching with L&D and 30-day HRBP check-ins.
    insights:
      - Manager quality is a main driver of early-career attrition.
      - Higher pay will not close this gap.
    recipients:
      - email: daniel.joseph@example.com
        role_hint: LTTS CHRO
      - email: rohan.iyer@example.com
        role_hint: Group HR Operations
    channels: [email, teams]
    routes_to: [L&D, HRBPs]
    steps:
      - Identify the bottom-quartile manager cohort
      - Launch coaching with L&D
      - Brief HRBPs on 30-day check-ins
    propose_args:
      subject: "Manager coaching: bottom-quartile programme"
      body: >
        Please launch the manager coaching programme for the bottom-quartile cohort —
        coaching and feedback enablement with L&D, plus HRBP 30-day check-ins.
        Confirm the enrolment list within one week.
      channel: email
      recipient_emails:
        - daniel.joseph@example.com
        - rohan.iyer@example.com
      company_codes: [LTTS, LTIM]
