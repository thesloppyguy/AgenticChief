# Synthetic Group workforce briefing pulse (HTML mockup-aligned). Not KPI-engine scores.
# Group totals plus per-IC slices under by_ic.<CODE>. Issues name ICs and link draft action_key.
as_of: "2026-10-07T07:12:00+05:30"
narrative: >
  The Group needs about 2,300 specialised engineers over 24 months for green hydrogen,
  electrolyser, and semiconductor work; the external market can sustainably supply about 1,000.
  LTTS holds the thinnest green energy benches; a talent programme and ATMP leadership plan
  are ready for approval. 34 of 130 critical roles have weak succession. Hiring volume is high
  but future-skill fit is only ~9%. Group retention is near target overall — LTIM Semiconductor
  Technologies (52) is the exception, with a retention plan ready for approval.
synthesized_by: Executive Analytics
insights:
  - Retention is the Group weak spot (73) — LTIM Semiconductor sits at 52. A retention plan awaits your approval.
  - About 70% of the 1,300 future-skill gap can be built internally; LTTS owns the green hydrogen pinch. Talent programme ready.
  - Ready-now succession is down 5 points; thinnest in LTTS Green Energy / Semiconductors and LTIM AI / ATMP.
  - Bottom-quartile managers at LTTS and LTIM drive most regretted exits — a coaching programme is ready for both IC CHROs.
